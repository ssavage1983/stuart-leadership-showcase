                                                            - heading "How often should I water the crown of my Soft Tree Fern in March?" [level=5] [ref=f35e294]
                                                        - paragraph [ref=f35e301]:
                                                            - generic [ref=f35e302]: As temperatures begin to fluctuate and the plant exits dormancy, the crown should be hydrated 2-3 times per week. During unseasonably warm or windy spells—which are common in the London microclimate—daily hydration becomes mandatory to ensure the developing fronds remain turgid during the critical unfurling phase.
