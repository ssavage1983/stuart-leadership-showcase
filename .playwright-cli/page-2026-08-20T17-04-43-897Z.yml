                      - heading [level=2] [ref=f85e487]:
                        - strong [ref=f85e489]: About the Designer
                      - heading [level=3] [ref=f85e494]:
                        - strong [ref=f85e496]: Stuart Savage | Founder & Lead Designer
                      - paragraph [ref=f85e501]:
                        - generic [ref=f85e502]:
                          - text: I am Stuart Savage, the creative force behind
                          - strong [ref=f85e503]: The Moonlight Garden Design Co.
                          - text: With deep roots in
                          - strong [ref=f85e504]: Lambeth and Kennington, South London
                          - text: ", I have dedicated over a decade to perfecting the art of landscaping and horticultural excellence."
                      - paragraph [ref=f85e509]:
                        - generic [ref=f85e510]:
                          - text: As a
                          - strong [ref=f85e511]: Remote Garden Design Specialist
                          - text: ", I have adapted my practice to serve clients"
                          - strong [ref=f85e512]: UK-wide
                          - text: ", employing state-of-the-art"
                          - strong [ref=f85e513]: 3D Cinematic Plans
                          - text: to bring complex outdoor visions to life before a single spade touches the ground. My signature approach focuses on creating
                          - strong [ref=f85e514]: nocturnal sanctuaries
                          - text: —gardens specifically designed to thrive and provide tranquility during the evening hours.
                      - paragraph [ref=f85e519]:
                        - generic [ref=f85e520]: By blending technical coding skills for platforms such as Shopify and Squarespace with a designer’s eye for seasonal interest, I ensure every project is both a botanical masterpiece and a seamless digital experience. The "Official 21" Winter Planting List featured in this blog exemplifies my commitment to year-round garden beauty.
                      - heading [level=3] [ref=f85e525]:
                        - strong [ref=f85e527]: Work With The Moonlight Garden Design Co.
                      - paragraph [ref=f85e532]:
                        - generic [ref=f85e533]:
                          - text: Are you ready to transform your outdoor space into a cinematic retreat? Do not miss our limited-time
                          - strong [ref=f85e534]: 40% OFF Launch Offer
                          - text: for remote design services.
