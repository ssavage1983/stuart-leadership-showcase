                  - heading "How Decking Installation Transforms Your Outdoor Experience" [level=2] [ref=f108e159]
                  - paragraph [ref=f108e165]:
                    - generic [ref=f108e166]: "Imagine stepping out onto a smooth, warm deck every morning. It’s a space that invites you to connect with nature without leaving home. Decking installation creates a seamless transition from indoors to outdoors. Here’s how it changes your garden life:"
                  - list [ref=f108e171]:
                    - listitem [level=1] [ref=f108e172]:
                      - paragraph [ref=f108e173]:
                        - generic [ref=f108e174]:
                          - strong [ref=f108e175]: Comfort and Convenience
                          - text: ": Decks provide a flat, stable surface. This makes outdoor dining and gatherings easier and safer."
                    - listitem [level=1] [ref=f108e176]:
                      - paragraph [ref=f108e177]:
                        - generic [ref=f108e178]:
                          - strong [ref=f108e179]: Year-Round Use
                          - text: ": With the right design, your deck can be enjoyed in all seasons. Add a pergola or canopy for shade and shelter."
                    - listitem [level=1] [ref=f108e180]:
                      - paragraph [ref=f108e181]:
                        - generic [ref=f108e182]:
                          - strong [ref=f108e183]: Wildlife Friendly
                          - text: ": Decks can be integrated with planting schemes that attract birds and pollinators, enhancing your garden’s ecosystem."
                    - listitem [level=1] [ref=f108e184]:
