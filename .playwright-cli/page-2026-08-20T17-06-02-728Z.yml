                  - heading "Why Choose Decking Installation Benefits for Your Garden?" [level=2] [ref=f108e100]
                  - paragraph [ref=f108e106]:
                    - generic [ref=f108e107]: "Decking offers more than just a pretty surface. It brings practical advantages that improve your lifestyle and boost your property’s value. Here’s why decking installation stands out:"
                  - list [ref=f108e112]:
                    - listitem [level=1] [ref=f108e113]:
                      - paragraph [ref=f108e114]:
                        - generic [ref=f108e115]:
                          - strong [ref=f108e116]: Expands Living Space
                          - text: ": A deck extends your home outdoors. It’s perfect for dining, socialising, or simply unwinding with a book."
                    - listitem [level=1] [ref=f108e117]:
                      - paragraph [ref=f108e118]:
                        - generic [ref=f108e119]:
                          - strong [ref=f108e120]: Low Maintenance
                          - text: ": Modern decking materials resist rot, pests, and weather damage. This means less time cleaning and more time enjoying."
                    - listitem [level=1] [ref=f108e121]:
                      - paragraph [ref=f108e122]:
                        - generic [ref=f108e123]:
                          - strong [ref=f108e124]: Enhances Aesthetics
                          - text: ": Decks add texture and warmth to your garden. They complement plants, paths, and patios beautifully."
                    - listitem [level=1] [ref=f108e125]:
                      - paragraph [ref=f108e126]:
                        - generic [ref=f108e127]:
                          - strong [ref=f108e128]: Increases Property Value
                          - text: ": A quality deck is an investment. It attracts buyers and can increase your home’s market price."
                    - listitem [level=1] [ref=f108e129]:
                      - paragraph [ref=f108e130]:
