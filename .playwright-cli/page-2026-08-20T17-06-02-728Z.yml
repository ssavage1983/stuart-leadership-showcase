                  - heading "What is the 3 4 5 Rule for Decking?" [level=2] [ref=f108e213]
                  - paragraph [ref=f108e219]:
                    - generic [ref=f108e220]: The 3 4 5 rule is a simple technique used to ensure your deck corners are square. It’s based on the Pythagorean theorem and helps avoid costly mistakes during construction.
                  - paragraph [ref=f108e225]:
                    - generic [ref=f108e226]: "Here’s how it works:"
                  - list [ref=f108e231]:
                    - listitem [level=1] [ref=f108e232]:
                      - paragraph [ref=f108e233]:
                        - generic [ref=f108e234]: Measure 3 units along one edge from the corner.
                    - listitem [level=1] [ref=f108e235]:
                      - paragraph [ref=f108e236]:
                        - generic [ref=f108e237]: Measure 4 units along the adjacent edge.
                    - listitem [level=1] [ref=f108e238]:
                      - paragraph [ref=f108e239]:
                        - generic [ref=f108e240]: Measure the diagonal between these two points.
                    - listitem [level=1] [ref=f108e241]:
                      - paragraph [ref=f108e242]:
                        - generic [ref=f108e243]: If the diagonal measures exactly 5 units, your corner is a perfect right angle.
                  - paragraph [ref=f108e247]:
                    - generic [ref=f108e248]: This rule is essential for achieving a professional finish. It ensures your deck frame is aligned correctly, preventing uneven boards and structural issues.
                  - paragraph [ref=f108e253]:
                    - generic [ref=f108e254]: Using this method during decking installation guarantees a neat, durable result that looks great and lasts.
                  - heading "Choosing the Right Materials for Your Deck" [level=2] [ref=f108e259]
                  - paragraph [ref=f108e265]:
                    - generic [ref=f108e266]: "Selecting the right materials affects your deck’s appearance, durability, and maintenance. Here are common options and their benefits:"
                  - list [ref=f108e271]:
                    - listitem [level=1] [ref=f108e272]:
                      - paragraph [ref=f108e273]:
                        - generic [ref=f108e274]:
                          - strong [ref=f108e275]: Timber Decking
                          - text: ": Offers natural beauty and warmth. Choose hardwoods like oak or tropical woods for longevity. Softwoods need treatment to resist decay."
                    - listitem [level=1] [ref=f108e276]:
                      - paragraph [ref=f108e277]:
                        - generic [ref=f108e278]:
                          - strong [ref=f108e279]: Composite Decking
                          - text: ": Made from recycled wood and plastic. It’s low maintenance, resistant to fading and splintering, and eco-friendly."
                    - listitem [level=1] [ref=f108e280]:
                      - paragraph [ref=f108e281]:
                        - generic [ref=f108e282]:
                          - strong [ref=f108e283]: PVC Decking
                          - text: ": Fully synthetic, highly durable, and easy to clean. Ideal for wet climates and allergy sufferers."
                    - listitem [level=1] [ref=f108e284]:
                      - paragraph [ref=f108e285]:
                        - generic [ref=f108e286]:
                          - strong [ref=f108e287]: Aluminium Decking
                          - text: ": Lightweight, strong, and rust-proof. Perfect for modern designs and long-term investment."
                  - paragraph [ref=f108e291]:
                    - generic [ref=f108e292]: Consider your garden’s style, budget, and how much upkeep you want. I can help you decide the best fit when you book a garden quote.
                  - heading "Maximising Your Garden’s Potential with Decking" [level=2] [ref=f108e297]
                  - paragraph [ref=f108e303]:
                    - generic [ref=f108e304]: "A deck is more than a platform - it’s a foundation for creativity. Use it to enhance your garden’s function and beauty:"
